name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build-docs.py', 'luci-app-usque/Makefile', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'scripts/build-docs.py', 'luci-app-usque/Makefile', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usque-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/build-docs.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/docs
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: pages
