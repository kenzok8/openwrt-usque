name: Release

# 打 tag 时重新跑一遍完整矩阵，用同一份产物出 Release。
# 默认只建草稿，正文里的版本与说明由本地补齐后再发布。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag，例如 v2026.11.09'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "$tag" in
            v*) ;;
            *) echo "tag 必须以 v 开头：$tag" >&2; exit 1 ;;
          esac
          printf 'name=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: usque-sdk*
          merge-multiple: false

      - name: Assemble assets
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -eu
          mkdir -p out/sdk-24.10 out/sdk-25.12
          for dir in dist/usque-sdk*; do
            [ -d "$dir" ] || continue
            sdk=$(basename "$dir" | sed -n 's/^usque-sdk\([0-9.]*\)-.*/\1/p')
            # 架构取自 artifact 目录名 usque-sdk<sdk>-<arch>-<sha>，sha 为 40 位 hex
            arch=$(basename "$dir" | sed -n 's/^usque-sdk[0-9.]*-\(.*\)-[0-9a-f]\{40\}$/\1/p')
            case "$sdk" in
              24.10 | 25.12) target="out/sdk-$sdk" ;;
              *) echo "未知 SDK：$dir" >&2; exit 1 ;;
            esac
            [ -n "$arch" ] || { echo "无法从 $dir 解析架构" >&2; exit 1; }
            # ipk 文件名自带架构，原名拷；apk 文件名不带架构，补 -架构（照 honk 的 release 命名），否则 7 个架构互相覆盖
            for f in "$dir"/*.ipk; do
              [ -f "$f" ] || continue
              cp "$f" "$target/"
            done
            for f in "$dir"/*.apk; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in Packages*|APKINDEX*|packages.adb*) continue ;; esac
              base=$(basename "$f" .apk)
              case "$base" in
                *-"$arch") cp "$f" "$target/${base}.apk" ;;
                *) cp "$f" "$target/${base}-${arch}.apk" ;;
              esac
            done
          done
          for sdk in 24.10 25.12; do
            dir="out/sdk-$sdk"
            count=$(find "$dir" -maxdepth 1 -type f | wc -l)
            [ "$count" -gt 0 ] || {
              echo "SDK $sdk 没有产物" >&2
              exit 1
            }
            # SHA256SUMS 按 SDK 分开命名，两个同名文件 gh release create 上传时会 422
            (cd "$dir" && sha256sum ./* > "SHA256SUMS-$sdk")
          done
          find out -type f | sort | sed 's|^|  |'

      - name: Write draft notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          python3 - "$TAG" > notes.md <<'PY'
          import os
          import pathlib
          import sys

          tag = sys.argv[1]
          base = f'https://github.com/{os.environ["GH_REPO"]}/releases/download/{tag}'

          ARCH_ORDER = [
              'x86_64', 'aarch64_generic', 'aarch64_cortex-a53', 'aarch64_cortex-a72',
              'aarch64_cortex-a76', 'arm_cortex-a7_neon-vfpv4', 'arm_cortex-a9',
          ]

          def link(name):
              return f'[`{name}`]({base}/{name})'

          def pkg_of(name):
              for prefix in ('luci-app-usque', 'usque'):
                  if name.startswith(prefix):
                      return prefix
              return 'other'

          def collect(sdk):
              d = pathlib.Path('out') / f'sdk-{sdk}'
              return sorted(p.name for p in d.iterdir() if p.is_file() and p.suffix in ('.ipk', '.apk'))

          def split(names):
              common, by_arch = [], {}
              for n in names:
                  if '_all' in n or '-all' in n:
                      common.append(n)
                      continue
                  for a in ARCH_ORDER:
                      if a in n:
                          by_arch.setdefault(a, []).append(n)
                          break
                  else:
                      common.append(n)
              return common, by_arch

          print(f'# Usque {tag}')
          print()
          print('> 草稿：修复与改进段落由维护者补齐后再发布。')
          print()
          print('## 版本')
          print()
          print('| 项目 | 版本 |')
          print('| --- | --- |')
          print(f'| Git tag | {tag} |')
          print('| usque 包 | 以包内版本为准，见附件文件名 |')
          print('| 上游核心 | Diniboy1123/usque v4.2.1 |')
          print()
          print('## 修复')
          print()
          print('- 待补。')
          print()
          print('## 功能改进')
          print()
          print('- 待补。')
          print()
          print('## 构建与安装')
          print()
          for sdk, fmt in (('24.10', 'IPK'), ('25.12', 'APK')):
              common, by_arch = split(collect(sdk))
              print(f'### OpenWrt {sdk}（{fmt}）')
              print()
              if common:
                  print('通用包（所有架构）：')
                  print()
                  print('| 包 | 下载 |')
                  print('| --- | --- |')
                  for n in common:
                      print(f'| {pkg_of(n)} | {link(n)} |')
                  print()
              if by_arch:
                  print('按架构下载：')
                  print()
                  print('| 架构 | usque | luci-app-usque |')
                  print('| --- | --- | --- |')
                  for a in ARCH_ORDER:
                      if a not in by_arch:
                          continue
                      names = by_arch[a]
                      u = next((n for n in names if pkg_of(n) == 'usque'), None)
                      l = next((n for n in names if pkg_of(n) == 'luci-app-usque'), None)
                      print(f'| {a} | {link(u) if u else "-"} | {link(l) if l else "-"} |')
                  print()
              print(f'校验文件：[`SHA256SUMS-{sdk}`]({base}/SHA256SUMS-{sdk})')
              print()
          print('安装前先校验（按 SDK 用对应的文件）：')
          print()
          print('```sh')
          print('sha256sum -c SHA256SUMS-24.10  # OpenWrt 24.10')
          print('sha256sum -c SHA256SUMS-25.12  # OpenWrt 25.12')
          print('```')
          print()
          print('## 已知限制')
          print()
          print('- 待补：本次验证范围与实际覆盖的架构。')
          PY
          cat notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -eu
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "tag $TAG 已有 Release，不覆盖" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --draft \
            --title "Usque $TAG" \
            --notes-file notes.md \
            out/sdk-24.10/*.ipk out/sdk-24.10/SHA256SUMS-24.10 \
            out/sdk-25.12/*.apk out/sdk-25.12/SHA256SUMS-25.12
